name: Pin GitHub Action

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "The owner of the repository to run"
        required: true
      repository:
        description: "The repository to run"
        required: true
      branch:
        description: "The branch to run"
        required: true
      pull_request:
        description: "The pull request number"
        required: true
      installationId:
        description: "The installation id"
        required: true
      checkRunId:
        description: "The check run id"
        required: true
      workflow:
        description: "The workflow file path or glob pattern to pin (action files at the repository root and under .github/actions are always included)"
        required: false
        default: ".github/workflows/*.yml"

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  GHA_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

jobs:
  pin-github-action:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }} # the numeric App ID is accepted as the JWT issuer
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.event.inputs.owner }}
          repositories: ${{ github.event.inputs.repository }}
          permission-contents: write # checkout + push
          permission-pull-requests: write # PR comments
          permission-checks: write # check run updates

      - name: Mark check run as in_progress
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          repo: ${{ github.event.inputs.owner }}/${{ github.event.inputs.repository }}
          check_id: ${{ github.event.inputs.checkRunId }}
          status: in_progress
          details_url: ${{ env.GHA_URL }}
          output: |
            {"title": "Workflow started 🏃🏻‍➡️", "summary": "See details in the workflow run."}

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: "${{ github.event.inputs.owner }}/${{ github.event.inputs.repository }}"
          ref: ${{ github.event.inputs.branch }}
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Run pin-github-action
        env:
          WORKFLOW_PATH: ${{ github.event.inputs.workflow }}
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -o pipefail
          WORKFLOW_PATTERN="${WORKFLOW_PATH:-.github/workflows/*.yml}"
          # Action definitions: repository root (action repositories) and
          # local actions at any depth under .github/actions
          ACTION_PATTERNS="action.yml action.yaml .github/actions/**/action.yml .github/actions/**/action.yaml"

          shopt -s nullglob globstar
          CANDIDATES=($WORKFLOW_PATTERN $ACTION_PATTERNS)
          shopt -u nullglob globstar

          # Keep only existing, unique files that reference at least one action.
          # This skips JavaScript/Docker actions, which have no steps to pin.
          declare -A SEEN=()
          FILES=()
          for file in "${CANDIDATES[@]}"; do
            [ -f "$file" ] || continue
            [ -z "${SEEN[$file]:-}" ] || continue
            SEEN[$file]=1
            if grep -qE '^[[:space:]]*(-[[:space:]]*)?uses:' "$file"; then
              FILES+=("$file")
            fi
          done

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No workflow or action files with actions to pin matched: ${WORKFLOW_PATTERN} ${ACTION_PATTERNS}" | tee pin-github-action.log
            exit 0
          fi

          echo "Files to process:"
          printf '  %s\n' "${FILES[@]}"

          if npx --yes pin-github-action --allow-empty "${FILES[@]}" 2>&1 | tee pin-github-action.log; then
            exit_code=0
          else
            exit_code="${PIPESTATUS[0]}"
          fi

          exit "$exit_code"

      - name: Read pin-github-action.log
        uses: guibranco/github-file-reader-action-v2@e20f1ce4044b9c0432cac170153f43ade4452ac4 # v2.3.97
        id: log
        with:
          path: pin-github-action.log

      - name: Delete pin-github-action.log
        run: rm pin-github-action.log 2> /dev/null

      - name: Update PR with comment (result)
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        if: ${{ steps.log.outputs.contents != '' }}
        with:
          repo-token: ${{ steps.generate_token.outputs.token }}
          repo-owner: ${{ github.event.inputs.owner }}
          repo-name: ${{ github.event.inputs.repository }}
          issue: ${{ github.event.inputs.pull_request }}
          refresh-message-position: true
          allow-repeats: true
          message: |
            :pushpin: [Pin GitHub Action](${{ env.GHA_URL }}) result:

            ```
            ${{ steps.log.outputs.contents }}
            ```

      - name: Update PR with comment (no output)
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        if: ${{ steps.log.outputs.contents == '' }}
        with:
          repo-token: ${{ steps.generate_token.outputs.token }}
          repo-owner: ${{ github.event.inputs.owner }}
          repo-name: ${{ github.event.inputs.repository }}
          issue: ${{ github.event.inputs.pull_request }}
          refresh-message-position: true
          allow-repeats: true
          message: |
            :warning: [Pin GitHub Action](${{ env.GHA_URL }}) executed! There's no need for any changes.

      - name: Verify changed files
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20
        id: verify-changed-files

      - name: Config git
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "150967461+gstraccini[bot]@users.noreply.github.com"
          git config --local user.name "gstraccini[bot]"
          git config --global --add --bool push.autoSetupRemote true

      - name: Commit files
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git add .
          git commit -m "chore: pin GitHub Actions to immutable commit SHA"
          echo "sha1=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git push origin "$BRANCH"

      - name: Mark check run as success
        if: success()
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          repo: ${{ github.event.inputs.owner }}/${{ github.event.inputs.repository }}
          check_id: ${{ github.event.inputs.checkRunId }}
          conclusion: success
          details_url: ${{ env.GHA_URL }}
          output: |
            {"title": "Workflow passed ✅", "summary": "See details in the workflow run."}

      - name: Update PR with comment (failure)
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        if: failure()
        with:
          repo-token: ${{ steps.generate_token.outputs.token }}
          repo-owner: ${{ github.event.inputs.owner }}
          repo-name: ${{ github.event.inputs.repository }}
          issue: ${{ github.event.inputs.pull_request }}
          refresh-message-position: true
          allow-repeats: true
          message: |
            :x: [Pin GitHub Action](${{ env.GHA_URL }}) failed!

      - name: Mark check run as failure
        if: failure()
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          repo: ${{ github.event.inputs.owner }}/${{ github.event.inputs.repository }}
          check_id: ${{ github.event.inputs.checkRunId }}
          conclusion: failure
          details_url: ${{ env.GHA_URL }}
          output: |
            {"title": "Workflow failed ❌", "summary": "See details in the workflow run."}
